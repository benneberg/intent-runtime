name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write # REQUIRED: Allows the CI to push the new lockfile back to your repo

jobs:
  validate:
    name: Build, Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Recommended for auto-commit action to properly push changes
          fetch-depth: 0 

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # cache: 'npm'  <-- KEEP THIS COMMENTED OUT FOR THIS RUN

      - name: Install dependencies
        run: npm install

      - name: Lint and Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test

      - name: Build Application Bundle
        run: npm run build

      - name: Auto-commit package-lock.json
        # Only run this step on Node 20.x to avoid Git push race conditions 
        # across your matrix (18.x, 20.x, and 22.x)
        if: matrix.node-version == '20.x'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate and save package-lock.json"
          file_pattern: "package-lock.json"
