name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Bun natively understands bun.lock and will fetch the correct 
        # Linux native bindings for @tailwindcss/oxide automatically.
        run: bun install

      - name: Lint and Type Check
        run: bun run lint

      - name: Run Test Suite
        run: bun run test

      - name: Build Application Bundle
        run: bun run build
